<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Exercicio1</title>
</head>
<body>

    <!-- a) O texto deverá ser em cor azul com tamanho 3 -->
    <font face="Arial" size="3" color="blue">
        <b>Barra de Ferramentas (Imagens)</b>
    </font>

    <!-- b) Linha horizontal cinza de tamanho 2 -->
    <hr size="2" color="gray">

    <!-- c) Imagens da barra de ferramentas com atributo title/alt para mostrar o texto ao posicionar o mouse -->
    <img src="buscar.png" alt="Buscar" title="Buscar">
    <img src="mostrar_todos.png" alt="Mostrar todos" title="Mostrar todos">
    <img src="registro_anterior.png" alt="Registro Anterior" title="Registro Anterior">
    <img src="proximo_registro.png" alt="Próximo Registro" title="Próximo Registro">
    <img src="salvar.png" alt="Salvar" title="Salvar">
    <img src="limpar.png" alt="Limpar" title="Limpar">
    <img src="excluir.png" alt="Excluir" title="Excluir">

    <br><br>

    <!-- Seção de Links -->
    <font face="Arial" size="3" color="blue">
        <b>Links</b>
    </font>

    <!-- b) Linha horizontal cinza de tamanho 2 -->
    <hr size="2" color="gray">

    <!-- d) Links para os sites da Unesp e da Receita Federal -->
    <a href="https://www.unesp.br" target="_blank">Unesp</a><br>
    <a href="https://www.gov.br/receitafederal" target="_blank">Receita Federal</a>

</body>
</html>
