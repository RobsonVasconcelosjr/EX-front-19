<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Exercício 5 - Frames</title>
</head>

<frameset cols="20%,80%">
    <!-- Frame do Menu à esquerda -->
    <frame src="menu.html" name="menu">
    
    <!-- Divisão vertical à direita: Principal (90%) e Rodapé (10%) -->
    <frameset rows="90%,10%">
        <frame src="principal.html" name="principal">
        <frame src="rodape.html" name="rodape">
    </frameset>
</frameset>

</html>
