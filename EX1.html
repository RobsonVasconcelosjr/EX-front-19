<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Exercício</title>
</head>
<body>

    <!-- a) Cabeçalho "Sistema de Órgãos Colegiados" de tamanho 3 e centralizado -->
    <h3 align="center">Sistema de Órgãos Colegiados</h3>

    <!-- b) Linha horizontal de tamanho (espessura) 2 e cor cinza -->
    <hr size="2" color="gray">

    <!-- c) "Cursos de Graduação" em fonte Arial, tamanho 3 e cor Azul -->
    <font face="Arial" size="3" color="blue">
        Cursos de Graduação
    </font><br>

    <!-- d) "Cursos de Pós-Graduação" em Negrito, fonte Arial, tamanho 3 e cor Verde -->
    <b><font face="Arial" size="3" color="green">
        Cursos de Pós-Graduação
    </font></b><br>

    <!-- e) "Mestrado" em Itálico, fonte Arial, tamanho 3 e cor Laranja -->
    <i><font face="Arial" size="3" color="orange">
        Mestrado
    </font></i><br>

    <!-- f) "Doutorado" em Sublinhado, fonte Arial, tamanho 3 e cor Vermelha -->
    <u><font face="Arial" size="3" color="red">
        Doutorado
    </font></u><br>

    <!-- g) Texto pré-formatado como mostrado na figura, fonte Arial, tamanho 5 e cor Magenta -->
    <font face="Arial" size="5" color="magenta">
<pre>
    Esta é
        a primeira
    aula de
        HTML.
</pre>
    </font>

</body>
</html>
