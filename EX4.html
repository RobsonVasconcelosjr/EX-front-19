<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Exercício 3</title>
</head>
<body>

    <!-- Título principal em azul -->
    <font face="Arial" size="3" color="blue">
        <b>Notas dos alunos</b>
    </font>

    <!-- Linha horizontal preta -->
    <hr size="2" color="black">

    <br>

    <!-- Tabela com borda e alinhamento centralizado -->
    <table border="1" cellspacing="2" cellpadding="5" align="center">
        <!-- Primeira linha do cabeçalho -->
        <tr>
            <th rowspan="2" align="center">Alunos</th>
            <th colspan="2" align="center">Notas</th>
        </tr>
        
        <!-- Segunda linha do cabeçalho com subcabeçalhos em itálico -->
        <tr>
            <th align="center"><i>Prova</i></th>
            <th align="center"><i>Trabalho</i></th>
        </tr>

        <!-- Linha 1: Ana Paula (Fundo cinza) -->
        <tr bgcolor="#C0C0C0">
            <td>Ana Paula</td>
            <td align="center"><font color="green">10</font></td>
            <td align="center"><font color="green">8</font></td>
        </tr>

        <!-- Linha 2: Beatriz (Fundo branco) -->
        <tr>
            <td>Beatriz</td>
            <td align="center"><font color="green">7</font></td>
            <td align="center"><font color="red">5</font></td>
        </tr>

        <!-- Linha 3: Joaquim (Fundo cinza) -->
        <tr bgcolor="#C0C0C0">
            <td>Joaquim</td>
            <td align="center"><font color="green">9</font></td>
            <td align="center"><font color="green">10</font></td>
        </tr>

        <!-- Linha 4: Paulo (Fundo branco) -->
        <tr>
            <td>Paulo</td>
            <td align="center"><font color="red">4,5</font></td>
            <td align="center"><font color="green">6</font></td>
        </tr>

        <!-- Linha 5: Tadeu (Fundo cinza) -->
        <tr bgcolor="#C0C0C0">
            <td>Tadeu</td>
            <td align="center"><font color="red">3</font></td>
            <td align="center"><font color="red">2</font></td>
        </tr>
    </table>

</body>
</html>
